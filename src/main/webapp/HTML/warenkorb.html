<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warenkorb - Webshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../CSS/shoppingcart.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-primary mb-4" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="landingpage.html">Webshop</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="landingpage.html">Home</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 me-3">
                <li class="nav-item">
                    <a class="btn btn-outline-light active" href="warenkorb.html">
                        <i class="bi bi-cart"></i> Warenkorb
                    </a>
                </li>
            </ul>

            <div id="authButtons" class="d-flex gap-2"></div>
        </div>
    </div>
</nav>

<main class="cart-container">
    <h1>Dein Warenkorb</h1>

    <section id="cart-items" class="cart-items">
    </section>

    <div class="cart-summary">
        <div class="summary-total">
            <span>Gesamtsumme:</span>
            <span id="total-price">CHF 0.00</span>
        </div>
        <button id="checkout-btn" class="checkout-btn">Zur Kasse</button>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../Javascript/logout.js?v=3"></script>
<script src="../Javascript/warenKorbArtikel.js?v=3"></script>
</body>
</html>

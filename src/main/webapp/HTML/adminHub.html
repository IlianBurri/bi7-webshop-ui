<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Bereich - Webshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="../CSS/adminHub.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-primary mb-4" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="landingpage.html">Webshop</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="landingpage.html">Home</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 me-3">
                <li class="nav-item">
                    <a class="btn btn-outline-light" href="warenkorb.html">
                        <i class="bi bi-cart"></i> Warenkorb
                    </a>
                </li>
            </ul>

            <div id="authButtons" class="d-flex gap-2"></div>
        </div>
    </div>
</nav>

<main>
    <form id="adminForm" class="admin-form" novalidate>
        <h1>Artikel hinzufügen</h1>

        <div class="admin-form__group">
            <label for="artikelName">Artikel Name</label>
            <input type="text" id="artikelName" name="name" maxlength="255"
                   placeholder="z. B. iPhone 15 Pro" autocomplete="off">
            <p class="admin-form__error" id="nameError"></p>
        </div>

        <div class="admin-form__group">
            <label for="artikelPreis">Preis (CHF)</label>
            <input type="number" id="artikelPreis" name="preis" min="0.01" step="0.01"
                   placeholder="z. B. 1199.00">
            <p class="admin-form__error" id="preisError"></p>
        </div>

        <div class="admin-form__group">
            <label for="artikelBild">Bild-Link</label>
            <input type="url" id="artikelBild" name="bild"
                   placeholder="https://example.com/bild.jpg">
            <p class="admin-form__error" id="bildError"></p>
        </div>

        <button type="submit" class="admin-form__submit">Artikel hinzufügen</button>

        <p class="admin-form__status" id="formStatus"></p>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../Javascript/logout.js?v=7"></script>
<script src="../Javascript/adminHub.js?v=4"></script>
</body>
</html>

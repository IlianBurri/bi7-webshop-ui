<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/design-system.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-primary mb-4" data-bs-theme="dark">
  <div class="container-fluid">
    
    <a class="navbar-brand" href="landingpage.html">Webshop</a>

  
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

   
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="landingpage.html">Home</a>
        </li>
          <li>
              <a class="nav-link" href="landingpage.html">Produkte</a>
          </li>
      </ul>



      <div class="d-flex gap-2">
        <a href="loginForm.html" class="btn btn-outline-light">Login</a>
      </div>
    </div>
  </div>
</nav>

<div class="container">
    <main class="form-page">
        <div class="form-card">
            <header class="form-card-header">
                <h1>Registrieren</h1>
            </header>

            <div class="form-card-body">
                <form id="registerForm" class="stack">
                    <div class="form-field">
                        <label for="username">Benutzername</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="form-field">
                        <label for="email">E-Mail-Adresse</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-field">
                        <label for="password">Passwort</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn-primary">Account erstellen</button>

                    <p class="text-center">
                        <a href="loginForm.html">Account vorhanden? Jetzt Anmelden</a>
                    </p>
                </form>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../Javascript/register.js?v=3"></script>
<script src="../Javascript/logout.js?v=3"></script>
</body>
</html>

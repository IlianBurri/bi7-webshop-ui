<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeBuff - Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-primary mb-4" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="landingpage.html">Webshop</a>
    <div class="collapse navbar-collapse show" id="navbarContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="landingpage.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="buff-status.html">Buff-Status</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">FreeBuff Status</h4>
                </div>
                <div class="card-body text-center">
                    <div id="statusContainer">
                        <p class="lead mb-3">Prüfe Buff-Status...</p>
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Lädt...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../Javascript/logoutHandler.js"></script>

<script>
    async function checkBuffStatus() {
        const container = document.getElementById('statusContainer');

        try {
            const res = await fetch('/api/buff-status');

            if (!res.ok) {
                throw new Error('Server meldet Fehler: ' + res.status);
            }

            const data = await res.json();
            const now = Date.now();
            const expiration = data.expiration;
            const diffMs = expiration - now;

            if (diffMs <= 0) {
                container.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        <h5 class="alert-heading"><i class="bi bi-x-circle"></i> Status Expired</h5>
                        <p class="mb-0">Die FreeBuff-Lizenz ist abgelaufen.</p>
                        <hr>
                        <small class="mb-0">Abgelaufen am: ${new Date(expiration).toLocaleDateString('de-CH')}</small>
                    </div>
                `;
            } else {
                const daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
                container.innerHTML = `
                    <div class="alert alert-success" role="alert">
                        <h5 class="alert-heading"> Active</h5>
                        <p class="mb-0">FreeBuff ist noch <strong>${daysLeft}</strong> Tag${daysLeft !== 1 ? 'e' : ''} gültig.</p>
                        <hr>
                        <small class="mb-0">Gültig bis: ${new Date(expiration).toLocaleDateString('de-CH')}</small>
                    </div>
                `;
            }
        } catch (err) {
            container.innerHTML = `
                <div class="alert alert-warning" role="alert">
                    <h5 class="alert-heading"> Verbindungsfehler</h5>
                    <p class="mb-0">Server nicht erreichbar.</p>
                    <hr>
                    <small class="mb-0">${err.message}</small>
                </div>
            `;
        }
    }

    document.addEventListener('DOMContentLoaded', checkBuffStatus);
</script>

</body>
</html>

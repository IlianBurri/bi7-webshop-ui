<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandingPage-Webshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-primary mb-4" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="landingpage.html">Webshop</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="landingpage.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Produkte</a>
                </li>
            </ul>

            <div id="authButtons" class="d-flex gap-2"></div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="p-5 mb-4 bg-light rounded-3 shadow-sm">
        <div class="container-fluid py-5">
            <h1 id="welcomeLabel" class="display-5 fw-bold">Willkommen im Webshop!</h1>
            <p class="col-md-8 fs-4">Entdecke unsere besten Angebote und Produkte.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../Javascript/logout.js"></script>
<script>
    const welcomeLabel = document.getElementById('welcomeLabel');
    const username = localStorage.getItem('username')
    if (welcomeLabel && username) {
        welcomeLabel.innerText = 'Willkommen im Webshop, ' + username + '!';
    }
</script>
</body>
</html>
